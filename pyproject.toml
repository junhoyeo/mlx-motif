[project]
name = "mlx-motif"
version = "0.0.1"
description = "The canonical MLX port of Motif models on Apple Silicon."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Junho Yeo", email = "i@junho.io" }]
requires-python = ">=3.11"
keywords = ["mlx", "motif", "apple-silicon", "llm", "differential-attention"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
]
dependencies = [
  "mlx>=0.21.0",
  "mlx-lm>=0.20.0",
  "numpy>=1.26",
  "safetensors>=0.4.5",
  "transformers>=4.46,<5",
  "huggingface-hub>=0.26",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "torch>=2.4",
]

[project.scripts]
mlx-motif = "mlx_motif.__main__:main"

[project.urls]
Homepage = "https://github.com/junhoyeo/mlx-motif"
Issues = "https://github.com/junhoyeo/mlx-motif/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_motif"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
